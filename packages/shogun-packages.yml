notes: >-
  Shogun publishes first-party client packages primarily as Frontend integration
  SDKs (npm @frontend-sdk/*, repo github.com/getshogun/frontend-integrations and
  frontend-sdk) and platform extensions. The @frontend-sdk/* integration adapters
  belong to the Shogun Frontend product, which Shogun has announced it is retiring
  (see lifecycle/). The Magento 2 / Adobe Commerce extensions cover the Page Builder
  product. Shogun does not publish a general-purpose REST/GraphQL API client library.
