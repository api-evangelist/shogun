aid: shogun
name: Shogun
description: >-
  Shogun is an ecommerce experience platform that helps Shopify and BigCommerce
  merchants build and optimize high-converting storefronts without code. Its
  flagship product, the Shogun Page Builder, is a drag-and-drop editor for
  landing pages, product pages, blog posts, and reusable store sections, backed
  by A/B Testing, Smart Pages personalization, and an AI Section Builder. Shogun
  also operated Shogun Frontend, a headless commerce framework with a Frontend
  GraphQL API and a family of @frontend-sdk integration libraries, which the
  company has announced it is retiring to concentrate on Page Builder. Shogun is
  used by tens of thousands of scaling brands and is backed by Accel, Initialized
  Capital, and Insight Partners.
